# Weight-sharing variant 3: only Self-Attention is reused across all 16
# layers; FFN and LayerNorm stay independent per layer. Same d_model/d_ff/
# vocab as model_1024.yaml for an apples-to-apples comparison.
vocab_size: 32000
d_model: 1024
n_layers: 16
n_heads: 8
d_ff: 2816
max_seq_len: 512
rope_theta: 10000.0
rms_norm_eps: 1.0e-5
dropout: 0.0
tie_embeddings: true
attn_sharing: full
ffn_sharing: none
eos_token_id: 31999
