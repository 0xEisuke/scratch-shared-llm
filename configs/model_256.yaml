# Standard (independent-layer) comparison model, d_model=256.
# intermediate_size = round((8/3 * d_model) / 256) * 256, rounding rule kept
# identical across all 4 standard configs (see model_512/768/1024.yaml).
# vocab_size/eos_token_id must match the GPT-NeoX-Japanese tokenizer
# fetched via scratch_llm.tokenizer.fetch_pretrained_tokenizer.
vocab_size: 32000
d_model: 256
n_layers: 16
n_heads: 8
d_ff: 768
max_seq_len: 512
rope_theta: 10000.0
rms_norm_eps: 1.0e-5
dropout: 0.0
tie_embeddings: true
attn_sharing: none
ffn_sharing: none
eos_token_id: 31999
