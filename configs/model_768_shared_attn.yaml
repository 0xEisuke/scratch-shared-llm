# Weight-sharing variant 3: only Self-Attention is reused across all 16
# layers; FFN and LayerNorm stay independent per layer. Same d_model/d_ff/
# vocab as model_768.yaml for an apples-to-apples comparison against the
# standard model at this size (same pattern as model_1024_shared_attn.yaml).
vocab_size: 32000
d_model: 768
n_layers: 16
n_heads: 8
d_ff: 2048
max_seq_len: 512
rope_theta: 10000.0
rms_norm_eps: 1.0e-5
dropout: 0.0
tie_embeddings: true
attn_sharing: full
ffn_sharing: none
eos_token_id: 31999
