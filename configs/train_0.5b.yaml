# Full-scale training config for the 0.5B model.
# Target token budget: ~20x params ~= 10B tokens (see mdfiles/prd.md).
# max_steps here is a placeholder -- set it once the real training corpus
# and batch/seq_len are decided: max_steps = target_tokens / (batch_size * seq_len * grad_accum_steps).
batch_size: 32
grad_accum_steps: 4
max_steps: 100000
lr: 3.0e-4
min_lr: 3.0e-5
warmup_steps: 2000
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
dtype: bf16
device: cuda
seed: 1337
log_interval: 50
eval_interval: 500
eval_iters: 50
save_interval: 1000
out_dir: checkpoints/run_0.5b
