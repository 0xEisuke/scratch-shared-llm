# Config for the small-data overfitting sanity check.
batch_size: 2
grad_accum_steps: 1
max_steps: 300
lr: 5.0e-3
min_lr: 5.0e-4
warmup_steps: 10
weight_decay: 0.0
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
dtype: bf16
device: cuda
seed: 1337
log_interval: 50
eval_interval: 300
eval_iters: 5
save_interval: 300
out_dir: checkpoints/overfit
